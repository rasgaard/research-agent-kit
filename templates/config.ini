[hpc]
# SSH host alias from ~/.ssh/config
host = dtu
# {user}, {home}, and {repo} expand remotely per project.
# Default is BeeGFS scratch (fast, not backed up). For a project with
# /dtu/p1/<user> project storage, override per-project in your config.
remote_root = /work3/{user}/hpc/{repo}
# Shared environment on scratch (hpc sync-env writes here).
venv = /work3/{user}/hpc/venvs/{repo}
hf_home = /work3/{user}/hf
uv_cache = /work3/{user}/.cache/uv
# User-wide secrets, written by `hpc secret set NAME`; source it from jobs.
secrets = $HOME/.config/dtu-hpc/secrets.env
# Project secrets, written by `hpc secret set --project NAME`; sourced after the
# global file so project values win. {project} is a repo-name + origin hash.
project_secrets = $HOME/.config/dtu-hpc/projects/{project}.env
