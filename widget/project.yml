name: DTUHPCStatus
options:
  bundleIdPrefix: com.rasgaard
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  DTUHPC:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: DTU HPC Status
        CFBundleDisplayName: DTU HPC Status
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: com.rasgaard.dtuhpc
            CFBundleURLSchemes:
              - dtuhpc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rasgaard.dtuhpc
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: DTUHPCWidget
        embed: true
        codeSign: true
  DTUHPCWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleName: DTU HPC Status Widget
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/Widget/DTUHPCWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /.local/state/dtu-hpc/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rasgaard.dtuhpc.widget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  DTUHPCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DTUHPC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rasgaard.dtuhpc.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DTUHPC:
    build:
      targets:
        DTUHPC: all
        DTUHPCWidget: all
    test:
      targets:
        - DTUHPCTests
